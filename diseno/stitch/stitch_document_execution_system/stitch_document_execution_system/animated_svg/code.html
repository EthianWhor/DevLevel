<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_SVG_START:ANIMATION_16 class="fixed inset-0 w-full h-full" --><div class="fixed inset-0 w-full h-full" id="animated-svg-ANIMATION_16" style="display:block;"><svg height="100%" shape-rendering="crispEdges" viewbox="0 0 320 320" width="100%" xmlns="http://www.w3.org/2000/svg">
<defs>
<style>
      @keyframes floatPulse {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(-8px) scale(1.02); }
      }
      @keyframes runeGlow {
        0%, 100% { opacity: 0.4; filter: drop-shadow(0 0 2px #ffd700); }
        50% { opacity: 1; filter: drop-shadow(0 0 10px #ffd700); }
      }
      @keyframes gemShine {
        0%, 100% { fill: #00ffff; filter: drop-shadow(0 0 4px #00e5ff); }
        50% { fill: #ffffff; filter: drop-shadow(0 0 14px #00ffff); }
      }
      @keyframes particleDrift {
        0% { transform: translateY(0) scale(1); opacity: 0; }
        30% { opacity: 1; }
        80% { opacity: 0.8; }
        100% { transform: translateY(-30px) scale(0.5); opacity: 0; }
      }
      .shield-group {
        animation: floatPulse 3.5s ease-in-out infinite;
        transform-origin: center;
      }
      .glow-rune {
        animation: runeGlow 2.5s ease-in-out infinite;
      }
      .gem-core {
        animation: gemShine 2s ease-in-out infinite;
      }
      .p1 { animation: particleDrift 2.8s linear infinite; }
      .p2 { animation: particleDrift 3.4s linear infinite 0.7s; }
      .p3 { animation: particleDrift 2.2s linear infinite 1.3s; }
      .p4 { animation: particleDrift 3.0s linear infinite 1.9s; }
    </style>
</defs>
