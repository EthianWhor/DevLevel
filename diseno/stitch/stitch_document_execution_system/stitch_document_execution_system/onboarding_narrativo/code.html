<script>
        // Simple typing effect simulation
        document.addEventListener("DOMContentLoaded", () => {
            const textElement = document.querySelector('.typing-effect');
            const fullText = "Bienvenido, Recluta de la Lógica.<br>Tu entrenamiento en las artes arcanas del código comienza aquí.";
            textElement.innerHTML = '';
            
            let i = 0;
            let isTag = false;
            let text = "";
            
            function typeWriter() {
                if (i < fullText.length) {
                    text += fullText.charAt(i);
                    textElement.innerHTML = text;
                    i++;
                    setTimeout(typeWriter, 40); // speed
                }
            }
            
            setTimeout(typeWriter, 500); // initial delay
        });
    </script>
