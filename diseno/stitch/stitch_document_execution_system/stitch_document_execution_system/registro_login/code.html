<style>
        .pixel-border {
            border: 4px solid var(--tw-prose-body);
            border-color: #1E293B;
            box-shadow: 4px 4px 0px 0px #0F172A;
        }
        .pixel-button {
            border: 4px solid #1E293B;
            box-shadow: 0px 4px 0px 0px #705e00;
            transition: all 0.1s ease-in-out;
        }
        .pixel-button:active {
            transform: translateY(4px);
            box-shadow: 0px 0px 0px 0px #705e00;
        }
        .pixel-input:focus {
            outline: none;
            border-color: #22C55E;
            box-shadow: 0px 0px 0px 2px #22C55E;
        }
        .blinking-cursor {
            animation: blink 1s step-end infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen font-body-md antialiased selection:bg-xp-green selection:text-dungeon-black">
<!-- TopAppBar -->
<header class="bg-surface dark:bg-surface w-full top-0 sticky border-b-4 border-border-pixel bg-surface-container-low z-50">
<div class="flex items-center justify-between px-margin-mobile h-20 w-full max-w-screen-xl mx-auto">
<div class="flex items-center gap-3">
<div class="w-10 h-10 bg-surface-container-highest border-2 border-border-pixel rounded flex items-center justify-center overflow-hidden">
<img alt="Pixel-art Hero Avatar" class="w-full h-full object-cover pixelated" data-alt="A small pixel art portrait of a fantasy hero character with a blue hood and determined expression, 8-bit style, isolated on a dark background." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDiNkHl1EA8YNUZiFDfSe2BU34pjWp6VYP2JY0tBKPjy_8FpBpwWuGtTsaGPJm2uuvPjkrgUivlfet-YzUqY9ADFIUX_Xm34sKAX_HSiAIk3HdaEbK0g-Iv1KNZJpsngg-RaDlRYutROj5ZR2n2LDerC_2tdKu63zwe8ULIoPMcwD8l4wc_u1_FgHZZ9IqhYXYctdHtxnFyRTgh6aZ7_Y3Won20id8ywJvLuf6EIsVSiz8YUNuHzzBEdQ"/>
</div>
<h1 class="font-headline-md text-headline-md text-primary dark:text-primary-fixed tracking-tight">DevLevel</h1>
</div>
<button class="w-10 h-10 flex items-center justify-center bg-surface-container border-2 border-border-pixel hover:bg-surface-variant transition-colors group rounded">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed group-hover:-translate-y-0.5 transition-transform" data-icon="bolt">bolt</span>
</button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex items-center justify-center p-4 md:p-margin-desktop min-h-[calc(100vh-80px)]">
<div class="w-full max-w-md mx-auto">
<!-- Quest Board (Login Form Container) -->
<div class="bg-surface-container-high pixel-border p-6 md:p-8 relative">
<!-- Decorative Corners -->
<div class="absolute -top-1 -left-1 w-3 h-3 bg-border-pixel"></div>
<div class="absolute -top-1 -right-1 w-3 h-3 bg-border-pixel"></div>
<div class="absolute -bottom-1 -left-1 w-3 h-3 bg-border-pixel"></div>
<div class="absolute -bottom-1 -right-1 w-3 h-3 bg-border-pixel"></div>
<!-- Header -->
<div class="text-center mb-8">
<h2 class="font-headline-lg-mobile md:font-headline-lg text-level-up-gold mb-2 uppercase tracking-wide">Enter the Dungeon</h2>
<p class="font-body-md text-on-surface-variant">Log in to continue your quest.</p>
</div>
<!-- Tabs (Login/Register) -->
<div class="flex mb-6 border-b-4 border-surface-container">
<button class="flex-1 py-3 font-label-pixel text-label-pixel text-level-up-gold border-b-4 border-level-up-gold -mb-1 relative z-10 transition-colors">
                        LOGIN
                    </button>
<button class="flex-1 py-3 font-label-pixel text-label-pixel text-on-surface-variant hover:text-on-surface transition-colors">
                        REGISTER
                    </button>
</div>
<!-- Form -->
<form class="space-y-6" id="loginForm">
<!-- Email Field -->
<div class="space-y-2">
<label class="font-label-pixel text-label-pixel text-on-surface block" for="email">Email Address</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-on-surface-variant">mail</span>
<input class="w-full bg-dungeon-black border-2 border-border-pixel text-xp-green font-label-pixel p-3 pl-10 focus:ring-0 pixel-input transition-all placeholder:text-on-surface-variant/50" id="email" placeholder="hero@guild.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex justify-between items-center">
<label class="font-label-pixel text-label-pixel text-on-surface block" for="password">Password</label>
<a class="font-label-pixel text-xs text-mana-blue hover:text-tertiary-fixed underline decoration-dashed underline-offset-4 transition-colors" href="#">Forgot Password?</a>
</div>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-on-surface-variant">lock</span>
<input class="w-full bg-dungeon-black border-2 border-border-pixel text-xp-green font-label-pixel p-3 pl-10 focus:ring-0 pixel-input transition-all placeholder:text-on-surface-variant/50" id="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Submit Button -->
<button class="w-full bg-level-up-gold text-on-primary-fixed-variant font-label-pixel text-label-pixel py-4 px-6 flex items-center justify-center gap-2 pixel-button mt-4 uppercase tracking-widest" type="submit">
<span class="material-symbols-outlined text-on-primary-fixed-variant">login</span>
                        Join Party
                    </button>
</form>
<!-- Divider -->
<div class="my-8 flex items-center justify-center relative">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t-2 border-dashed border-surface-container"></div>
</div>
<div class="relative bg-surface-container-high px-4 font-label-pixel text-xs text-on-surface-variant">OR CONTINUE WITH</div>
</div>
<!-- Social Logins -->
<div class="grid grid-cols-2 gap-4">
<button class="bg-surface border-2 border-border-pixel py-3 px-4 flex items-center justify-center gap-2 hover:bg-surface-container transition-colors" type="button">
<img alt="Google" class="w-5 h-5 pixelated" data-alt="A stylized, simplified 8-bit pixel art version of a generic multicolored 'G' logo representing a major search engine, set against a dark background." src="https://lh3.googleusercontent.com/aida-public/AB6AXuB0aWhZmQskootuELWdLbs7KwvmplRA0L3dFvzJ3FI_N99H2Bguld-kg0CE0YaQUriEL8y0p0tFHhQG38OCCcXm8cJ7p0ZIDaP55pvBULLbUhWyjHxGA0G4PEQmJfW6gllEqW6lLRmCKWdYkwGv3ySZ6TGlSKYmOh2Gx0N54wojlqKd-CuqbseNbecpcvF9hfkn4kiFaruOGVVq2hhh7toR_KxPGuP0Z5ieDGLiFZZxgoycnjcpJF6XBg"/>
<span class="font-label-pixel text-xs text-on-surface">Google</span>
</button>
<button class="bg-surface border-2 border-border-pixel py-3 px-4 flex items-center justify-center gap-2 hover:bg-surface-container transition-colors" type="button">
<img alt="Apple" class="w-5 h-5 pixelated" data-alt="A stylized, simplified 8-bit pixel art version of a generic white apple silhouette logo, set against a dark background." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAJDShAepoJgStl-HBAVKwuTdyyAxAVnOJGYB3Jby6N-wGKjC0t9Rofu0r9lXomSXuC2zMBPpczk-B0VWU7douTpXB5GTDOJTSYJAE-UIEyBm5b-jbi9zAfHq6V92gsZQ_VTX3S9O1ypiCB2zU3koAHuNXaiWMHNnEezbCSj4qX86UAF_sEku_MliyPcLHD0UfZkpLwStZLfFxOLK8wCrGY45Pysa357YtNOPy3Lqo9MougweaE6_smLw"/>
<span class="font-label-pixel text-xs text-on-surface">Apple</span>
</button>
</div>
</div>
</div>
</main>
<script>
        // Simple form interaction to demonstrate focus state in console
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', function() {
                this.classList.add('blinking-cursor-effect-wrapper');
            });
            input.addEventListener('blur', function() {
                this.classList.remove('blinking-cursor-effect-wrapper');
            });
        });
    </script>
</body></html>
