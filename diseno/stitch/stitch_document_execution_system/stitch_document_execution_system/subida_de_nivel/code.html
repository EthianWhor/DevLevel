<!DOCTYPE html>

<html class="dark" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Level Up - DevLevel</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400&amp;family=JetBrains+Mono:wght@600&amp;family=Space+Grotesk:wght@700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "inverse-surface": "#eae2cf",
                        "surface-container-high": "#2e2a1e",
                        "on-primary": "#3a3000",
                        "on-secondary-fixed-variant": "#005227",
                        "primary-fixed-dim": "#e9c400",
                        "on-secondary": "#003919",
                        "outline-variant": "#4d4732",
                        "tertiary-container": "#00f1ff",
                        "level-up-gold": "#FACC15",
                        "secondary": "#4de082",
                        "error-container": "#93000a",
                        "tertiary": "#defcff",
                        "on-error": "#690005",
                        "on-surface": "#eae2cf",
                        "village-light": "#F8FAFC",
                        "on-tertiary-fixed-variant": "#004f54",
                        "on-background": "#eae2cf",
                        "on-primary-fixed": "#221b00",
                        "background": "#161308",
                        "surface-container-highest": "#393528",
                        "surface-container": "#231f14",
                        "tertiary-fixed": "#79f5ff",
                        "on-tertiary-fixed": "#002022",
                        "secondary-fixed": "#6dfe9c",
                        "on-error-container": "#ffdad6",
                        "surface-dim": "#161308",
                        "error": "#ffb4ab",
                        "surface-container-lowest": "#110e05",
                        "on-secondary-container": "#003e1c",
                        "surface-bright": "#3d392c",
                        "tertiary-fixed-dim": "#00dbe8",
                        "surface-container-low": "#1f1b10",
                        "primary": "#fff6df",
                        "on-primary-container": "#705e00",
                        "surface-tint": "#e9c400",
                        "surface-variant": "#393528",
                        "border-pixel": "#1E293B",
                        "on-tertiary-container": "#006a70",
                        "primary-fixed": "#ffe16d",
                        "on-primary-fixed-variant": "#544600",
                        "primary-container": "#ffd700",
                        "surface": "#161308",
                        "xp-green": "#22C55E",
                        "on-surface-variant": "#d0c6ab",
                        "on-tertiary": "#00363a",
                        "outline": "#999077",
                        "secondary-container": "#00b55d",
                        "inverse-primary": "#705d00",
                        "inverse-on-surface": "#343024",
                        "mana-blue": "#3B82F6",
                        "health-red": "#EF4444",
                        "dungeon-black": "#0F172A",
                        "on-secondary-fixed": "#00210c",
                        "secondary-fixed-dim": "#4de082"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "16px",
                        "container-padding": "12px",
                        "margin-mobile": "20px",
                        "pixel-unit": "4px",
                        "margin-desktop": "40px"
                    },
                    "fontFamily": {
                        "body-md": ["Inter"],
                        "headline-md": ["Space Grotesk"],
                        "headline-lg": ["Space Grotesk"],
                        "body-lg": ["Inter"],
                        "label-pixel": ["JetBrains Mono"],
                        "headline-lg-mobile": ["Space Grotesk"]
                    },
                    "fontSize": {
                        "body-md": ["16px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "headline-md": ["24px", { "lineHeight": "1.3", "fontWeight": "700" }],
                        "headline-lg": ["32px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "label-pixel": ["14px", { "lineHeight": "1", "fontWeight": "600" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "1.2", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        .pixel-border {
            border: 2px solid theme('colors.border-pixel');
        }
        .pixel-bevel {
            border-bottom: 4px solid theme('colors.on-primary-fixed-variant');
        }
        .pixel-bevel:active {
            border-bottom-width: 0px;
            transform: translateY(4px);
        }
        .animate-float {
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        .animate-pulse-glow {
            animation: pulse-glow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse-glow {
            0%, 100% { opacity: 1; filter: drop-shadow(0 0 10px theme('colors.level-up-gold')); }
            50% { opacity: .5; filter: drop-shadow(0 0 2px theme('colors.level-up-gold')); }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col items-center justify-center font-body-md overflow-hidden relative">
<!-- Background Decoration -->
<div class="absolute inset-0 pointer-events-none opacity-20" style="background-image: radial-gradient(theme('colors.level-up-gold') 1px, transparent 1px); background-size: 32px 32px; background-position: -16px -16px;">
</div>
<div class="absolute inset-0 bg-gradient-to-t from-background via-transparent to-surface-container-highest pointer-events-none z-0"></div>
<!-- Main Content Container -->
<main class="relative z-10 w-full max-w-md px-margin-mobile flex flex-col items-center justify-center space-y-8">
<!-- Header Text -->
<div class="text-center animate-float">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-level-up-gold uppercase tracking-widest drop-shadow-[0_4px_0_rgba(0,0,0,1)]">
                ¡Nivel Superado!
            </h1>
</div>
<!-- Level Up Display -->
<div class="flex items-center justify-center space-x-6">
<div class="bg-surface-container-highest pixel-border p-container-padding flex flex-col items-center justify-center w-24 h-24">
<span class="font-label-pixel text-label-pixel text-on-surface-variant mb-2">LVL</span>
<span class="font-headline-md text-headline-md text-on-surface line-through decoration-health-red decoration-4 opacity-50">12</span>
</div>
<div class="text-level-up-gold">
<span class="material-symbols-outlined text-4xl animate-pulse-glow" style="font-variation-settings: 'FILL' 1;">double_arrow</span>
</div>
<div class="bg-surface-container-low pixel-border p-container-padding flex flex-col items-center justify-center w-32 h-32 relative transform scale-110 border-level-up-gold shadow-[0_0_20px_rgba(250,204,21,0.3)]">
<div class="absolute -top-3 -right-3">
<span class="material-symbols-outlined text-level-up-gold text-3xl animate-spin" style="font-variation-settings: 'FILL' 1;">star</span>
</div>
<span class="font-label-pixel text-label-pixel text-level-up-gold mb-2">LVL</span>
<span class="font-headline-lg-mobile text-headline-lg-mobile text-primary animate-pulse">13</span>
</div>
</div>
<!-- Unlocks Card -->
<div class="w-full bg-surface-container pixel-border p-container-padding">
<h2 class="font-label-pixel text-label-pixel text-on-surface-variant mb-4 border-b-2 border-border-pixel pb-2 flex items-center">
<span class="material-symbols-outlined mr-2" style="font-variation-settings: 'FILL' 1;">lock_open_right</span>
                Nuevos Hechizos Desbloqueados
            </h2>
<ul class="space-y-3">
<li class="flex items-start bg-surface p-2 pixel-border">
<div class="bg-mana-blue/20 p-2 mr-3 flex-shrink-0 pixel-border border-mana-blue/50">
<span class="material-symbols-outlined text-mana-blue" style="font-variation-settings: 'FILL' 1;">all_inclusive</span>
</div>
<div>
<h3 class="font-label-pixel text-label-pixel text-primary mb-1">Bucles Anidados</h3>
<p class="font-body-md text-body-md text-on-surface-variant text-sm">Controla el flujo del tiempo dentro del tiempo. Perfecto para matrices enemigas.</p>
</div>
</li>
</ul>
</div>
<!-- Action Button -->
<button class="w-full bg-level-up-gold text-on-primary font-label-pixel text-label-pixel py-4 px-6 pixel-border pixel-bevel flex items-center justify-center space-x-2 transition-all mt-4 hover:brightness-110">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">map</span>
<span>Volver al Mapa</span>
</button>
</main>
<!-- Navigation Shell Suppressed as this is a linear/transactional success screen -->
</body></html>
