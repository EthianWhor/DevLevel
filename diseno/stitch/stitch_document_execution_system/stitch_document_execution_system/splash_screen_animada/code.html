<script>
    document.addEventListener('DOMContentLoaded', () => {
      const phrases = [
        "Cargando Grimorio de Lógica...",
        "Sincronizando runas binarias...",
        "Invocando Arch-Mage...",
        "Calibrando bucles del Overworld...",
        "¡Reino desbloqueado!"
      ];

      const percentages = [20, 48, 74, 91, 100];
      const textElement = document.getElementById('loadingPhaseText');
      const percentElement = document.getElementById('loadingPercent');
      const progressContainer = document.getElementById('splashProgressBar');
      const skipButton = document.getElementById('skipButton');
      const motionToggle = document.getElementById('motionToggle');

      let currentStep = 0;
      let motionReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      // Update segment styles dynamically
      function updateBlocks(percentage) {
        if (!progressContainer) return;
        const blocks = progressContainer.querySelectorAll('.flex-1');
        const activeCount = Math.round((percentage / 100) * blocks.length);

        blocks.forEach((block, idx) => {
          if (idx < activeCount) {
            block.className = 'flex-1 h-full bg-level-up-gold border-r border-on-primary-fixed-variant transition-all duration-200';
          } else {
            block.className = 'flex-1 h-full bg-surface-container-high transition-all duration-200';
          }
        });
      }

      function advanceLoading() {
        if (currentStep < phrases.length) {
          textElement.textContent = phrases[currentStep];
          percentElement.textContent = percentages[currentStep] + '%';
          updateBlocks(percentages[currentStep]);

          if (currentStep === phrases.length - 1) {
            skipButton.textContent = "[ ENTRAR AL REINO AHORA ]";
            skipButton.classList.remove('bg-surface-container');
            skipButton.classList.add('bg-primary-container', 'text-on-primary-fixed', 'border-on-primary-fixed-variant', 'font-bold');
            skipButton.onclick = () => {
              // Simulated route navigation
              window.location.hash = "#onboarding";
            };
          }

          currentStep++;
          if (currentStep < phrases.length) {
            setTimeout(advanceLoading, motionReduced ? 400 : 850);
          }
        }
      }

      // Initial kickoff
      setTimeout(advanceLoading, 500);

      // Manual continue option
      skipButton.addEventListener('click', () => {
        currentStep = phrases.length - 1;
        advanceLoading();
      });

      // Accessible motion toggle
      motionToggle.addEventListener('click', () => {
        motionReduced = !motionReduced;
        document.body.classList.toggle('reduce-motion-active', motionReduced);
        motionToggle.classList.toggle('border-level-up-gold', motionReduced);
      });
    });
  </script>
</body></html>
